<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>忙しさ目安</title>
<style>
  :root {
    --bg: #fcfcfb; --fg: #0b0b0b; --muted: #52514e; --line: #e3e2dd;
    --urgent: #eda100; --normal: #1baf7a; --meetings: #eb6834; --free: #2a78d6;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --fg: #f0efec; --muted: #c3c2b7; --line: #333331;
      --urgent: #c98500; --normal: #199e70; --meetings: #d95926; --free: #3987e5;
    }
  }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
                 "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
    line-height: 1.6; padding: 24px 16px 48px;
  }
  main { max-width: 1520px; margin: 0 auto; }
  .layout { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 16px; }
  figure {
    margin: 0; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px;
    flex: 999 1 900px; min-width: 0;
  }
  figure svg { display: block; width: 100%; height: auto; min-width: 900px; }
  .totals {
    flex: 1 1 260px; min-width: 0; display: grid; gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .card h2 {
    font-size: 1rem; margin: 0 0 6px; display: flex; justify-content: space-between;
    align-items: baseline; gap: 8px;
  }
  .card h2 span { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
  .card dl { margin: 0; font-size: 0.9rem; }
  .card .row { display: grid; grid-template-columns: 1fr auto 3em; gap: 8px; }
  .card dd.pct { color: var(--muted); }
  .bar {
    display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden;
    margin: 0 0 8px;
  }
  .bar span { display: block; min-width: 0; }
  .card dt { color: var(--muted); white-space: nowrap; }
  .card dd {
    margin: 0; white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums;
  }
  .sw {
    display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px;
  }
  .tasks { background: var(--urgent); }
  .flex { background: var(--normal); }
  .meetings { background: var(--meetings); }
  .free { background: var(--free); }
  .links { margin-top: 20px; font-size: 0.85rem; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
