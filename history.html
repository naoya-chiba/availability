        var pts = vals[s.key].map(function (val, i) { return cx(i) + "," + y(val); });
        if (pts.length > 1) {
          el("polyline", { points: pts.join(" "), fill: "none", stroke: color(s.key), "stroke-width": 2,
                           "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
        }
        if (list.length <= 40) {
          vals[s.key].forEach(function (val, i) {
            el("circle", { cx: cx(i), cy: y(val), r: 4, fill: color(s.key), stroke: "var(--bg)", "stroke-width": 2 }, svg);
          });
        }
      });
      // 線の右端に系列名を直接書く（重なるときは凡例に任せる）
      var ends = shown.map(function (s) {
        var a = vals[s.key]; return { s: s, y: a.length ? y(a[a.length - 1]) : 0 };
      }).sort(function (a, b) { return a.y - b.y; });
      var clear = ends.every(function (e, i) { return i === 0 || e.y - ends[i - 1].y >= 14; });
      if (clear && list.length > 1 && slot / 2 + m.r >= 14) {
        ends.forEach(function (e) {
          el("text", { class: "dir", x: W - m.r, y: Math.max(12, e.y - 8), "text-anchor": "end" }, svg).textContent = e.s.name;
        });
      }
    }
    var dots = shown.map(function (s) {
      return el("circle", { r: 5, fill: color(s.key), stroke: "var(--bg)", "stroke-width": 2, visibility: "hidden" }, svg);
    });
    layout = { list: list, vals: vals, shown: shown, m: m, slot: slot, W: W, y: y, cx: cx, band: band,
               dots: asBars ? [] : dots };

    drawTiles(list);
    drawTable(list);
    var note = "";
    if (state.v === "bar" && !asBars && shown.length) note = "区間が多いため折れ線で表示しています。";
    if (unit === "hours") {
      note += "時間はタスクの重さの合計（重さが分からないものは " +
              (Math.round(DATA.default_weight_minutes / 6) / 10) + "h として換算）。";
    }
    document.getElementById("note").textContent = note;
    hideTip();
  }

  function drawTiles(list) {
    var box = document.getElementById("tiles"), unit = state.u, other = unit === "hours" ? "count" : "hours";
    var sum = { count: {}, hours: {} };
    SERIES.forEach(function (s) {
      sum.count[s.key] = 0; sum.hours[s.key] = 0;
      list.forEach(function (b) { sum.count[s.key] += b.count[s.key]; sum.hours[s.key] += b.hours[s.key]; });
    });
    function signed(v, u) { return (v > 0 ? "+" : v < 0 ? "−" : "±") + fmt(Math.abs(v), u); }
    var html = SERIES.map(function (s) {
      return '<div class="tile"><div class="name"><span class="sw" style="background:' + color(s.key) + '"></span>' +
        s.name + '</div><div class="value">' + fmt(sum[unit][s.key], unit) + '</div><div class="sub">' +
        fmt(sum[other][s.key], other) + "</div></div>";
    }).join("");
    html += '<div class="tile"><div class="name">追加 − 完了</div><div class="value">' +
      signed(sum[unit].added - sum[unit].completed, unit) + '</div><div class="sub">' +
      signed(sum[other].added - sum[other].completed, other) + "</div></div>";
    box.innerHTML = html;
    var from = list.length ? label(list[0].t, "day", true).replace(/（.）/, "") : "";
    document.getElementById("meta").textContent =
      (list.length ? from + " 〜 " + label(lastDay, "day", true).replace(/（.）/, "") + "　" : "") +
      "更新 " + (DATA.generated_at || "").replace("T", " ").slice(0, 16);
  }

  function drawTable(list) {
    var unit = state.u, head = "<tr><th>期間</th>" + SERIES.map(function (s) { return "<th>" + s.name + "</th>"; }).join("") + "</tr>";
    var body = list.slice().reverse().map(function (b) {
      return "<tr><td>" + label(b.t, state.g, true) + "</td>" + SERIES.map(function (s) {
        return "<td>" + fmt(b[unit][s.key], unit) + "</td>";
      }).join("") + "</tr>";
    }).join("");
    document.getElementById("table").innerHTML = head + body;
  }

  // ---- ホバー ----
  function hideTip() {
    tip.style.display = "none";
    if (layout) {
      layout.band.setAttribute("visibility", "hidden");
      layout.dots.forEach(function (d) { d.setAttribute("visibility", "hidden"); });
    }
  }
  function onMove(ev) {
    if (!layout || !layout.list.length) return;
    var box = svg.getBoundingClientRect();
    var x = (ev.clientX - box.left) * (layout.W / box.width);
    var i = Math.floor((x - layout.m.l) / layout.slot);
    if (i < 0 || i >= layout.list.length) { hideTip(); return; }
    var b = layout.list[i], unit = state.u, other = unit === "hours" ? "count" : "hours";
    layout.band.setAttribute("x", layout.m.l + layout.slot * i);
    layout.band.setAttribute("visibility", "visible");
    layout.dots.forEach(function (d, k) {
      d.setAttribute("cx", layout.cx(i));
      d.setAttribute("cy", layout.y(layout.vals[layout.shown[k].key][i]));
      d.setAttribute("visibility", "visible");
    });
    var cum = state.v === "cum";
    tip.innerHTML = layout.tip ? layout.tip(i) : "<b>" + label(b.t, state.g, true) + (cum ? " まで" : "") + "</b>" + layout.shown.map(function (s) {
      var main = cum ? layout.vals[s.key][i] : b[unit][s.key];
      return '<div class="r"><span><span class="sw" style="background:' + color(s.key) + '"></span>' + s.name +
        "</span><span>" + fmt(main, unit) + "</span>" + (cum ? "" : '<span class="o">' + fmt(b[other][s.key], other) + "</span>") + "</div>";
    }).join("");
    tip.style.display = "block";
    var pbox = panel.getBoundingClientRect();
    var left = ev.clientX - pbox.left + 14;
    if (left + tip.offsetWidth > pbox.width - 4) left = ev.clientX - pbox.left - tip.offsetWidth - 14;
    tip.style.left = Math.max(4, left) + "px";
    tip.style.top = Math.max(4, ev.clientY - pbox.top - tip.offsetHeight - 10) + "px";
  }
  svg.addEventListener("pointermove", onMove);
  svg.addEventListener("pointerdown", onMove);
  svg.addEventListener("pointerleave", hideTip);

  // ---- 操作 ----
  function syncControls() {
    Array.prototype.forEach.call(document.querySelectorAll(".group"), function (group) {
      var key = group.getAttribute("data-key");
      Array.prototype.forEach.call(group.querySelectorAll("button"), function (btn) {
        btn.setAttribute("aria-pressed", String(btn.getAttribute("data-v") === state[key]));
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll("#legend button"), function (btn) {
      btn.setAttribute("aria-pressed", String(!state.hidden[btn.getAttribute("data-s")]));
    });
    var sankey = state.v === "sankey";
    document.getElementById("legend").style.display = sankey ? "none" : "";
    document.getElementById("slegend").style.display = sankey ? "" : "none";
    var hash = "g=" + state.g + "&u=" + state.u + "&r=" + state.r + "&v=" + state.v;
    try { history.replaceState(null, "", "#" + hash); } catch (e) { /* file:// などでは無視 */ }
  }
  function readHash() {
    var allowed = { g: ["day", "week", "month", "year"], u: ["count", "hours"],
                    r: ["1m", "3m", "6m", "1y", "all"], v: ["bar", "line", "cum", "sankey"] };
    location.hash.replace(/^#/, "").split("&").forEach(function (pair) {
      var kv = pair.split("=");
      if (allowed[kv[0]] && allowed[kv[0]].indexOf(kv[1]) >= 0) state[kv[0]] = kv[1];
    });
  }
  document.querySelector(".controls").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button");
    if (!btn) return;
    var key = btn.parentNode.getAttribute("data-key"), v = btn.getAttribute("data-v");
    state[key] = v;
    if (key === "g") state.r = DEFAULT_RANGE[v];  // まとめる単位に合った期間へ
    syncControls(); draw();
  });
  var legend = document.getElementById("legend");
  legend.innerHTML = SERIES.map(function (s) {
    return '<button type="button" data-s="' + s.key + '"><span class="sw" style="background:' + color(s.key) +
      '"></span>' + s.name + "</button>";
  }).join("");
  document.getElementById("slegend").innerHTML = FLOWS.map(function (f) {
    return '<span><span class="sw" style="background:' + color(f.color) + '"></span>' + f.name + "</span>";
  }).join("");
  legend.addEventListener("click", function (ev) {
    var btn = ev.target.closest("button");
    if (!btn) return;
    var key = btn.getAttribute("data-s");
    state.hidden[key] = !state.hidden[key];
    syncControls(); draw();
  });
  var timer = null;
  window.addEventListener("resize", function () { clearTimeout(timer); timer = setTimeout(draw, 120); });

  readHash();
  syncControls();
  draw();
})();
</script>
</body>
</html>
